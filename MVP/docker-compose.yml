services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-http://localhost:8080}"
    expose:
      - "3000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
