server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 18.204.126.52;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/la-trampa;
    default_type text/plain;
  }

  location / {
    return 301 https://18.204.126.52$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name 18.204.126.52;

  ssl_certificate /etc/letsencrypt/live/18.204.126.52/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/18.204.126.52/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/la-trampa;
  index index.html;

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /health {
    proxy_pass http://127.0.0.1:3000/health;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
