services:
  backend:
    build: .
    environment:
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "8080:80"
